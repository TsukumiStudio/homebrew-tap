name: Update MornAIMeter cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ponytail: hourly polling avoids a cross-org token; use repository dispatch if latency matters.
          TAG="$(gh release view --repo matsufriends/MornAIMeter --json tagName --jq .tagName)"
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo matsufriends/MornAIMeter --pattern MornAIMeter.app.zip --dir "$RUNNER_TEMP"
          SHA="$(shasum -a 256 "$RUNNER_TEMP/MornAIMeter.app.zip" | awk '{print $1}')"
          sed -i "" -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/mornaimeter.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mornaimeter.rb
          git commit -m "mornaimeter ${VERSION}"
          git push
